name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Foundry format, build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Test
        run: forge test -vvv

  site:
    name: Next.js typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  tee-signature-compat:
    name: Flare signature compatibility helper
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/tee-signer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/tee-signer/go.mod
          cache-dependency-path: tools/tee-signer/go.sum
      - name: Format
        run: test -z "$(gofmt -d .)"
      - name: Test compile
        run: go test ./...
      - name: Vet
        run: go vet ./...

  web-state-tests:
    name: Legacy replay state tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Pure view-model tests over committed evidence
        run: node --test web/test/view.test.mjs web/test/surfaces.test.mjs

  proof-drift:
    name: Evidence mirror is byte-identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Site data must match committed evidence and spec
        run: |
          set -e
          for f in positive-proof negative-proof proof-gate; do
            cmp "site/data/$f.json" "evidence/$f.json"
          done
          cmp site/data/jorqeth-v1.json spec/jorqeth-v1.json
          echo "proof mirror is byte-identical"
