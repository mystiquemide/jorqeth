services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.mysql
    volumes:
      - fce-mysql:/var/lib/mysql
      - ./init.sh:/docker-entrypoint-initdb.d/00-jorqeth-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  indexer:
    build: ./indexer
    restart: unless-stopped
    command: ["./flare-cchain-indexer", "--config", "/app/config.toml"]
    env_file:
      - .env.indexer
    environment:
      NODE_URL: https://coston2-api.flare.network/ext/C/rpc
      DB_HOST: mysql
      DB_DATABASE: indexer
      DB_USERNAME: jorqeth
    volumes:
      - ./indexer.toml:/app/config.toml:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  proxy:
    build: ./proxy
    restart: unless-stopped
    env_file:
      - .env.proxy
    environment:
      PROXY_PRIVATE_KEY: ${FCE_PROXY_PRIVATE_KEY:?set FCE_PROXY_PRIVATE_KEY in .env}
    volumes:
      - ./proxy.toml:/app/config/config.template.toml:ro
    ports:
      - "127.0.0.1:6673:6663"
      - "127.0.0.1:6674:6664"
    depends_on:
      indexer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6664/info"]
      interval: 10s
      timeout: 5s
      retries: 30

  tee:
    build: ../../fce-extension
    image: jorqeth-fce:0.2.0
    restart: unless-stopped
    env_file:
      - .env.tee
    environment:
      MODE: "1"
      SIMULATED_TEE: "true"
      CHAIN_ID: "114"
      CHAIN_URL: https://falling-skilled-uranium.flare-coston2.quiknode.pro/ext/bc/C/rpc
      EXTENSION_ID: "0x000000000000000000000000000000000000000000000000000000000001026f"
      INITIAL_OWNER: "0x85a15B970eec3B6ae8A4518595F1f79e204Fbd19"
      GOVERNANCE_SIGNERS: "0x85a15B970eec3B6ae8A4518595F1f79e204Fbd19"
      GOVERNANCE_THRESHOLD: "1"
      PROXY_URL: http://proxy:6663
      CONFIG_PORT: "5501"
      SIGN_PORT: "7701"
      EXTENSION_PORT: "7702"
    depends_on:
      proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/jorqeth-fce", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  fce-mysql:
