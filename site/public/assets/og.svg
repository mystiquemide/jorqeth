<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#17150F"/>
  <rect x="0" y="0" width="1200" height="8" fill="#0FA36B"/>

  <!-- brand mark, scaled from mark.svg -->
  <g transform="translate(72,64) scale(0.95)">
    <rect x="2" y="2" width="60" height="60" rx="16" fill="#0FA36B"/>
    <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="#0A7D51" stroke-opacity="0.4"/>
    <path d="M24 18 H44" stroke="#FBF7EF" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M38.5 18 V37 C38.5 45 32 48 25.5 44" stroke="#FBF7EF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M22 51 H43" stroke="#FBF7EF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.82"/>
    <circle cx="47.5" cy="51" r="3.2" fill="#FF6A3D"/>
  </g>
  <text x="152" y="112" font-family="sans-serif" font-size="34" font-weight="600" fill="#FBF7EF" letter-spacing="-0.5">Jorqeth</text>

  <!-- headline -->
  <text x="72" y="286" font-family="sans-serif" font-size="76" font-weight="700" fill="#FBF7EF" letter-spacing="-2.5">Get paid exactly</text>
  <text x="72" y="372" font-family="sans-serif" font-size="76" font-weight="700" fill="#FBF7EF" letter-spacing="-2.5">what you earned.</text>

  <!-- subhead -->
  <text x="74" y="440" font-family="sans-serif" font-size="30" font-weight="400" fill="#FBF7EF" fill-opacity="0.72">Private, exact creator commission settlement.</text>
  <text x="74" y="482" font-family="sans-serif" font-size="30" font-weight="400" fill="#FBF7EF" fill-opacity="0.72">Proven on-chain, exact to the cent.</text>

  <!-- proof strip -->
  <g transform="translate(72,540)">
    <circle cx="9" cy="9" r="9" fill="#0FA36B"/>
    <text x="30" y="18" font-family="sans-serif" font-size="26" font-weight="600" fill="#FBF7EF">1 of 12 paths paid</text>
    <circle cx="322" cy="9" r="5" fill="#FF6A3D"/>
    <text x="342" y="18" font-family="sans-serif" font-size="26" font-weight="400" fill="#FBF7EF" fill-opacity="0.62">five sources agree</text>
  </g>
</svg>
